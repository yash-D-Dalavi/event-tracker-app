<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Event Finding & Tracking Platform</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-8">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [events, setEvents] = useState([
        { id: '1', name: 'Tech Conference 2026', date: '2026-10-10', venue: 'Convention Center', city: 'Mumbai' },
        { id: '2', name: 'Music Festival Vibe', date: '2026-10-15', venue: 'Open Ground', city: 'Pune' },
        { id: '3', name: 'AI & Cloud Summit', date: '2026-10-20', venue: 'IT Park Auditorium', city: 'Bangalore' }
      ]);
      const [rsvps, setRsvps] = useState([]);
      const [shareLinks, setShareLinks] = useState({});

      const handleRSVP = (event) => {
        const shareCode = Math.random().toString(36).substring(2, 8);
        const link = `http://localhost:5000/invite/${shareCode}`;
        setRsvps([...rsvps, event]);
        setShareLinks({ ...shareLinks, [event.id]: link });
      };

      return (
        <div class="max-w-4xl mx-auto">
          <h1 class="text-3xl font-bold mb-6 text-indigo-400">Event Finder & Vibe Tracker</h1>
          
          <h2 class="text-xl font-semibold mb-3">Upcoming Local Events</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            {events.map(ev => (
              <div key={ev.id} class="bg-gray-800 p-4 rounded-lg shadow border border-gray-700">
                <h3 class="text-lg font-bold text-yellow-400">{ev.name}</h3>
                <p class="text-sm text-gray-300">📅 {ev.date} | 📍 {ev.venue}, {ev.city}</p>
                
                <div class="mt-4 flex items-center justify-between">
                  <button 
                    onClick={() => handleRSVP(ev)} 
                    class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded text-sm font-medium">
                    Interested / RSVP
                  </button>

                  {shareLinks[ev.id] && (
                    <span class="text-xs text-green-400 font-mono bg-gray-900 p-1.5 rounded">
                      Invite Link Created!
                    </span>
                  )}
                </div>

                {shareLinks[ev.id] && (
                  <div class="mt-2 text-xs text-gray-400 break-all bg-gray-900 p-2 rounded">
                    Share Link: <a href={shareLinks[ev.id]} target="_blank" class="text-blue-400 underline">{shareLinks[ev.id]}</a>
                  </div>
                )}
              </div>
            ))}
          </div>

          <h2 class="text-xl font-semibold mb-3 text-green-400">RSVP Dashboard</h2>
          <div class="bg-gray-800 p-4 rounded-lg border border-gray-700">
            {rsvps.length === 0 ? (
              <p class="text-gray-400 text-sm">No confirmed events yet. Click RSVP above!</p>
            ) : (
              <ul class="space-y-2">
                {rsvps.map((r, idx) => (
                  <li key={idx} class="text-sm text-gray-200">✅ Confirmed Attendance for <strong>{r.name}</strong></li>
                ))}
              </ul>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
